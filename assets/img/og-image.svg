<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Alexandra Blair Antablin">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0%" stop-color="#1d1457"/>
            <stop offset="55%" stop-color="#0a0e27"/>
            <stop offset="100%" stop-color="#050816"/>
        </linearGradient>
        <radialGradient id="glow" cx="22%" cy="0%" r="80%">
            <stop offset="0%" stop-color="#5b3cc4" stop-opacity="0.55"/>
            <stop offset="60%" stop-color="#5b3cc4" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
