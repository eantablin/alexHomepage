            C 178 108 170 120 156 136
            C 168 124 176 116 186 112
            C 150 120 110 120 70 110
            C 56 116 40 128 28 132
            C 40 124 48 116 52 108
            C 44 104 40 96 30 86
            C 44 92 58 96 70 96
            C 110 92 140 80 160 64
            C 150 52 146 40 150 28
            C 158 40 168 50 178 56
            C 210 46 240 52 262 58
            C 274 60 284 64 288 70 Z"/>
    </g>

    <text x="90" y="250" font-family="Outfit, Arial, sans-serif" font-size="34" letter-spacing="6" fill="#38e1e8">PORTFOLIO</text>
    <text x="86" y="350" font-family="Outfit, Arial, sans-serif" font-weight="800" font-size="90" fill="url(#txt)">Alexandra Blair</text>
    <text x="86" y="440" font-family="Outfit, Arial, sans-serif" font-weight="800" font-size="90" fill="url(#txt)">Antablin</text>
